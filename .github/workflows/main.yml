name: frontend-ci-workflow

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:
    
permissions:
  contents: write
  id-token: write
  packages: write
  
jobs:

  push-changes:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Get Commit SHA
        id: get-sha
        run: echo "sha=${GITHUB_SHA}" >> "$GITHUB_OUTPUT"


  code-test:
    runs-on: ubuntu-latest
    needs: push-changes
    steps:
      - uses: actions/checkout@v4
      - name: Test start
        run: echo "code test start!"
      - name: Test end
        run: echo "code test end!"
      

  docker-build-and-push:
    runs-on: ubuntu-latest
    needs: code-test
    outputs:
      image_tag: ${{ steps.meta.outputs.image_tag }}
  
    steps:
      - uses: actions/checkout@v4
  
      - name: Generate docker image tag
        id: meta
        run: |
          IMAGE_TAG="${GITHUB_SHA}"
          echo "image_tag=${IMAGE_TAG}" >> "$GITHUB_OUTPUT"
          echo "Generated docker image tag: ${IMAGE_TAG}"

      - name: Login to Docker Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & Push Image
        run: |
          OWNER="${GITHUB_REPOSITORY_OWNER,,}"
          docker build -t ghcr.io/${OWNER}/frontend:${{ steps.meta.outputs.image_tag }} .
          docker push ghcr.io/${OWNER}/frontend:${{ steps.meta.outputs.image_tag }}
          echo "Pushed Docker: ghcr.io/${OWNER}/frontend:${{ steps.meta.outputs.image_tag }}"
          

  update-manifest-repo:
    runs-on: ubuntu-latest
    needs: docker-build-and-push
  
    steps:
      - name: Determine branch
        id: branch
        run: echo "branch=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
  
      - name: Checkout Manifests Repo (same branch)
        uses: actions/checkout@v4
        with:
          repository: OpenWallet-2025/OpenWallet_Manifest
          token: ${{ secrets.MANIFEST_REPO_TOKEN }}
          ref: ${{ steps.branch.outputs.branch }}
  
      - name: Update Image Tag
        run: |
          TAG="${{ needs.docker-build-and-push.outputs.image_tag }}"
          sed -i "/repository:\s*ghcr.io\/${{ github.repository_owner }}\/apps\/frontend/{n;s|tag:.*|tag: \"${TAG}\"|}" values.yaml
  
      - name: Commit & Push
        run: |
          git config user.name "${{ github.actor }}"
          git config user.email "${{ github.actor }}@users.noreply.github.com"
          git add .
          git commit -m "Update image to ${{ needs.docker-build-and-push.outputs.image_tag }}" || echo "No changes to commit"
          git push origin ${{ steps.branch.outputs.branch }}
