name: frontend-ci-workflow

on:
  push:
    branches: [develop]
    paths-ignore:
      - '.github/workflows/**'
  workflow_dispatch:
    
permissions:
  contents: write
  id-token: write
  packages: write
  
jobs:
   
  docker-build-and-push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
  
        #깃허브 패키지 레지스터리 접근
      - name: Login to Docker Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
    
          
      - name: Build & Push Image
        run: |
          OWNER="${GITHUB_REPOSITORY_OWNER,,}"   # lowercase 변환
          docker build -t ghcr.io/${OWNER}/frontend:${GITHUB_SHA} .
          #ghcr.io: GitHub Container Registry의 엔드포인트, github.repository_owner: 조직 이름(openwallet22025), 
          # backend <- 직접 지정, steps.meta.outputs.image_tag: <generate docker image tag>에서 export한 commit 해쉬값(sha)
          
          docker push ghcr.io/${OWNER}/frontend:${GITHUB_SHA}
          echo "Build and push Docker image: ghcr.io/${OWNER}/frontend:${GITHUB_SHA}"

    outputs:
      image_tag: ${{ steps.meta.outputs.image_tag }}
          
  update-manifest-repo:
    runs-on: ubuntu-latest
    needs: docker-build-and-push
    
    # push일 때만으로 변경
    if: github.event_name == 'push'
    steps:
      - name: Determine branch
        id: branch
        run: echo "branch=${GITHUB_REF_NAME}" >> $GITHUB_OUTPUT
    
      - name: Checkout Manifests Repo (same branch)
        uses: actions/checkout@v4
        with:
          repository: ${{ github.repository_owner }}/OpenWallet-manifests
          token: ${{ secrets.MANIFEST_ACCESS }}
          ref: ${{ steps.branch.outputs.branch }} # push한 브랜치와 동일한 이름의 브랜치로 checkout
    
      - name: Update Image Tag
        run: |
          NEW_TAG="${GITHUB_SHA}"
          # 'repository:' 라인 근처에서 'tag:'를 찾도록 범위를 제한합니다.
          sed -i '/repository:[[:space:]]*ghcr\.io\/openwallet-2025\/frontend/{n;s/^[[:space:]]*tag:.*/    tag: "'"${NEW_TAG}"'"/}' apps/frontend/values.yaml
    
      - name: Commit & Push
        run: |
          git config user.name "${{ github.actor }}"
          git config user.email "${{ github.actor }}@users.noreply.github.com"
          git add .
          git commit -m "Update image to ${{ needs.docker-build-and-push.outputs.image_tag }}" || echo "No changes to commit"
          git push origin ${{ steps.branch.outputs.branch }}
          echo "workflows end up\n Commit: Update image to ${{ needs.docker-build-and-push.outputs.image_tag }} \n actor:${{ github.actor }} ."

